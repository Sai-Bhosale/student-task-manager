<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 Student Task Manager</h1>
        <p>Manage your college tasks easily</p>
    </header>

    <main>

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

            <div class="card">
                <h3>In Progress</h3>
                <p id="progressTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

        </section>


        <!-- Add Task -->
        <section class="form-section">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Task title"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Task description"
                ></textarea>

                <select id="status">

                    <option value="pending">
                        Pending
                    </option>

                    <option value="in-progress">
                        In Progress
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>

                <input
                    type="date"
                    id="due_date"
                    required
                >

                <button type="submit">
                    ➕ Add Task
                </button>

            </form>

        </section>


        <!-- Tasks -->
        <section class="tasks-section">

            <div class="section-header">

                <h2>My Tasks</h2>

                <button onclick="loadTasks()">
                    🔄 Refresh
                </button>

            </div>

            <div id="taskList">
                <p>Loading tasks...</p>
            </div>

        </section>

    </main>


    <footer>
        <p>Student Task Manager | Node.js + Express + PostgreSQL</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
